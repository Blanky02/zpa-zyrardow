name: Update timetables & stops (daily)

on:
  schedule:
    - cron: '0 4 * * *' # codziennie 04:00 UTC (05:00 PL zima, 06:00 PL lato)
  workflow_dispatch: # pozwala uruchomić ręcznie z GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install requests beautifulsoup4 lxml

      - name: Run scraper (PDFy -> rzeczywiste godziny per przystanek)
        run: |
          echo "🧪 Parser PDF self-test"
          python scraper/test_pdf_timetables.py || echo "Parser tests failed but continuing"
          echo "🚍 Running scraper.py"
          python scraper/scraper.py || echo "Scraper failed but continuing"
          ls -lh timetables.json

      - name: Upload PDF times audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-times-report
          path: scraper/audits/pdf_times_report.json
          if-no-files-found: ignore

      - name: Update stops GPS from kiedyprzyjedzie.pl API
        run: |
          echo "📍 Running update_stops.py"
          python update_stops.py || echo "update_stops failed"
          ls -lh stops_gps.json stops_gps.js
          cp stops_gps.json public/stops_gps.json || true
          cp timetables.json public/timetables.json || true

      - name: Check for changes
        id: changes
        run: |
          git config user.name "ZPA Bot"
          git config user.email "zpa-bot@github-actions.local"
          git add timetables.json stops_gps.json stops_gps.js public/timetables.json public/stops_gps.json scraper/audits/pdf_times_report.json || true
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --staged --stat
          fi

      - name: Commit & Push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          META_VER=$(python -c "import json; print(json.load(open('timetables.json')).get('meta',{}).get('version',''))" 2>/dev/null || date +%Y-%m-%d)
          git commit -m "auto: update timetables & stops ${META_VER} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  build-check:
    runs-on: ubuntu-latest
    needs: update-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
